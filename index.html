<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clan Clash</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#2b1d10;--wood:#5a3b20;--line:#e8c36a;--ink:#fff6dc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;height:100dvh;overflow:hidden;text-shadow:0 2px 0 #000a}
#top{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:11px}
#top span{background:linear-gradient(#3a2815,#241709);border:2px solid var(--line);border-radius:0;padding:4px 8px}
#top .e{color:#e7a6ff}
.wrap{position:relative;width:min(100%,1000px);flex:1;min-height:0}
canvas{width:100%;height:100%;display:block;border:4px solid var(--line);touch-action:none;background:#3a7228}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#000a;padding:16px;font-size:12px;line-height:1.8}
#msg.on{display:flex}#msg div{background:linear-gradient(#6b4626,#43290f);border:4px solid var(--line);padding:16px 22px}
#panel{width:min(100%,1000px);max-height:42dvh;overflow:auto;flex:none;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sc{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}.sc button,.sc button.atk{flex:none}.okb{background:linear-gradient(#7ad24b,#3f8a22)}button{min-height:44px}#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:11}.mbox{background:linear-gradient(#5a3b20,#3b2815);border:4px solid var(--line);padding:14px;width:min(92%,420px);display:flex;flex-direction:column;gap:8px}body.land{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);gap:6px}body.land #top{grid-column:1/3}body.land .wrap{grid-column:1;grid-row:2;width:100%}body.land #panel{grid-column:2;grid-row:2;width:100%;max-height:none;overflow:auto}body.land .sc{flex-wrap:wrap;overflow-x:visible}#opp,#adm,#gate{position:fixed;inset:0;display:none;z-index:8;background:#1b1208f5;overflow:auto;padding:12px;flex-direction:column;gap:8px}#gate{align-items:center;justify-content:center;text-align:center;z-index:12}.al button{display:block;width:100%;text-align:left;margin:4px 0}.ad{background:#0006;padding:8px;display:flex;flex-direction:column;gap:6px}.ad input{font:inherit;font-size:11px;padding:8px;background:#1b1208;color:var(--ink);border:3px solid var(--line);border-radius:0}#auth{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000e;z-index:9;text-align:center}#auth>div{background:linear-gradient(#6b4626,#43290f);border:4px solid var(--line);padding:22px;width:min(92%,360px)}#auth input{font:inherit;font-size:12px;width:100%;margin:5px 0;padding:10px;background:#1b1208;color:var(--ink);border:3px solid var(--line);border-radius:0}
button{font:inherit;color:var(--ink);text-shadow:0 2px 0 #000a;background:linear-gradient(#8a5d33,#5a3b20);border:3px solid var(--line);border-radius:0;box-shadow:inset -3px -3px 0 #0006,inset 3px 3px 0 #fff3;padding:6px 8px;cursor:pointer;min-width:84px;font-size:9px;line-height:1.5}
button small{display:block;font-size:7px;opacity:.9;margin-top:3px}
button:focus-visible{outline:3px solid #fff}button.on{filter:brightness(1.3)}button:disabled{filter:grayscale(1) brightness(.6);cursor:default}
button.atk{background:linear-gradient(#f06a4d,#a8281a);flex:1;font-size:1.2rem}
.hint{font-size:8px;line-height:1.6;opacity:.85;text-align:center}.info{text-align:center;background:#0006;border-radius:10px;padding:6px}
</style></head><body>
<div id="top"></div>
<div class="wrap"><canvas id="c" width="340" height="210"></canvas><div id="msg"><div></div></div></div>
<div id="panel"></div>
<div id="menu"></div><div id="opp"></div><div id="adm"></div><div id="gate"></div>
<div id="auth"><div><b>Clan Clash</b><br><br><input id="au" placeholder="Usuario" maxlength="16" autocomplete="username"><br><input id="ap" type="password" placeholder="Contraseña" autocomplete="current-password"><br><br><button id="al">Entrar</button> <button id="ar">Registrarme</button><div id="am" class="hint"></div></div></div>
<script>
let N=24,TW=36,TH=36,OX=60,OY=60,cv=document.getElementById('c'),g=cv.getContext('2d'),K='clanclash2';
const M=l=>1+.4*(l-1);
const TY={
hall:{n:'Ayuntamiento',s:3,h:38,hp:1200,c:'#b9a27a',r:'#c0392b',e:'🏰'},
mine:{n:'Mina de oro',s:2,h:22,hp:300,c:'#8b6a3e',r:'#f5c542',e:'⛏️',cost:130,cur:'g',prod:'g',max:2},
pump:{n:'Extractor',s:2,h:24,hp:300,c:'#6d4a8a',r:'#c06be8',e:'💧',cost:130,cur:'g',prod:'e',max:2},
gst:{n:'Almacén oro',s:2,h:24,hp:600,c:'#8b6a3e',r:'#d4a017',e:'💰',cost:380,cur:'g',max:1},
est:{n:'Almacén elixir',s:2,h:24,hp:600,c:'#6d4a8a',r:'#8e44ad',e:'🧪',cost:380,cur:'g',max:1},
rax:{n:'Cuartel',s:2,h:26,hp:500,c:'#7a5a36',r:'#2f7fb8',e:'⚔️',cost:350,cur:'g',max:2},
wblock:{n:'Muro 2×2',s:2,h:10,hp:1,c:'#8a6a3e',r:'#b08a52',e:'',cost:48,cur:'g',max:100,flat:1},
scout:{n:'Puesto de exploración',s:2,h:30,hp:450,c:'#5a4a7a',r:'#7a4fb0',e:'',cost:300,cur:'g',max:1},
camp:{n:'Campamento',s:2,h:16,hp:400,c:'#7a5a36',r:'#4f9a3a',e:'🔥',cost:260,cur:'e',max:2},
cannon:{n:'Cañón',s:2,h:22,hp:420,c:'#777',r:'#444',e:'💣',cost:320,cur:'g',max:5,rg:7,dmg:24,rt:.8,col:'#fff'},
tower:{n:'Torre arquera',s:2,h:46,hp:380,c:'#8c6a45',r:'#b5844f',e:'🏹',cost:500,cur:'g',max:4,rg:9.5,dmg:14,rt:.6,col:'#ffd27a'},
mortar:{n:'Mortero',s:2,h:20,hp:350,c:'#666',r:'#383838',e:'🎯',cost:750,cur:'g',max:2,rg:10,mn:3,sp:1.5,dmg:28,rt:3.5},
wall:{n:'Muro',s:1,h:10,hp:320,c:'#8d8d8d',r:'#cfcfcf',e:'',cost:12,cur:'g',max:400,flat:1}};
const TR={
barb:{n:'Bárbaro',e:'🗡️',sp:1,cost:32,hp:110,dmg:16,v:1.9,rg:.5,rt:.9,c:'#f2c14e'},
arch:{n:'Arquero',e:'🏹',sp:1,cost:58,hp:55,dmg:11,v:2,rg:3.5,rt:.8,c:'#ff7ab0'},
giant:{n:'Gigante',e:'💪',sp:5,cost:320,hp:750,dmg:32,v:1.2,rg:.5,rt:1.8,c:'#e08a3c',pf:['cannon','tower','mortar'],r:12},
gob:{n:'Duende',e:'👺',sp:1,cost:38,hp:45,dmg:12,v:3.4,rg:.4,rt:.7,c:'#6fcf62',pf:['mine','pump','gst','est'],bn:2.5},
wb:{n:'Zapador',e:'💥',sp:2,cost:100,hp:60,dmg:0,v:2.4,rg:.4,rt:1,c:'#aab',w:1}};
const mhp=b=>b.t=='wall'?[300,300,800,1800][Math.min(3,b.lv)]:Math.round(TY[b.t].hp*(1+.3*(b.lv-1)));
const mk=(t,x,y,lv=1)=>{const b={t,x,y,lv,st:0,cd:0,up:0};b.max=b.hp=mhp(b);return b};
const fresh=()=>({g:700,e:700,tr:0,lv:0,army:{barb:0,arch:0,giant:0,gob:0,wb:0,king:0},sp:{zap:0,heal:0,rage:0},q:[],sc:0,b:[mk('hall',10,10),mk('mine',8,8),mk('pump',14,8),mk('camp',11,15)]});
let S=fresh(),mode='v',tab=null,sel=null,pk=null,hov=null,E=null,A=null,pick='barb',rs=0,pc='',last=performance.now();
const sum=(t,k)=>S.b.filter(b=>b.t==t).reduce((a,b)=>a+M(b.lv)*k,0);
const cap={g:()=>1500+sum('gst',2000)|0,e:()=>1500+sum('est',2000)|0};
const campCap=()=>S.b.filter(b=>b.t=='camp').reduce((a,b)=>a+15+5*b.lv,0);
const used=a=>Object.keys(TR).reduce((s,k)=>s+a[k]*TR[k].sp,0);
const cnt=t=>t=='wblock'?S.b.filter(b=>b.t=='wall').length>>2:S.b.filter(b=>b.t==t).length;
const cost=t=>TY[t].flat?TY[t].cost:Math.round(TY[t].cost*(1+.25*cnt(t)));
const upc=b=>b.t=='hall'?[1500,4000,9000,18000][b.lv-1]||99999:b.t=='wall'?[0,60,190][b.lv]||99999:Math.round(TY[b.t].cost*b.lv*2.2);
const builders=()=>2-S.b.filter(b=>b.up>0).length;
const free=(l,x,y,s)=>x>=0&&y>=0&&x+s<=N&&y+s<=N&&!l.some(b=>b.hp>0&&x<b.x+TY[b.t].s&&x+s>b.x&&y<b.y+TY[b.t].s&&y+s>b.y);
const at=(l,x,y)=>l.find(b=>b.hp>0&&x>=b.x&&x<b.x+TY[b.t].s&&y>=b.y&&y<b.y+TY[b.t].s);
const ctr=b=>[b.x+TY[b.t].s/2,b.y+TY[b.t].s/2];
const edge=(p,b)=>{const s=TY[b.t].s;return Math.hypot(Math.max(b.x-p.x,0,p.x-b.x-s),Math.max(b.y-p.y,0,p.y-b.y-s))};
const P=(x,y,z=0)=>[OX+x*TW,OY+y*TH-z];
const tl=e=>{const r=cv.getBoundingClientRect(),u=((e.clientX-r.left)/r.width*680-OX)/(TW/2),v=((e.clientY-r.top)/r.height*420-OY)/(TH/2);return[(u+v)/2,(v-u)/2]};
const save=()=>{try{S.ts=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(e){}try{syncBase()}catch(e){}};
try{const o=JSON.parse(localStorage.getItem(K));if(o&&o.b){S=o;S.army={...fresh().army,...S.army};S.sp=S.sp||fresh().sp;S.b.forEach(b=>{if(b.hp<=0)b.hp=b.max});vil(Math.min(28800,(Date.now()-o.ts)/1000))}}catch(e){}

function vil(dt){for(const b of S.b){const d=TY[b.t];
 if(d.prod&&!b.ruin&&!b.nb&&b.st<240*M(b.lv)){const a=Math.min(1.8*M(b.lv)*dt,240*M(b.lv)-b.st,cap[d.prod]()-S[d.prod]);if(a>0){S[d.prod]+=a;b.st+=a}}
 if(b.up>0&&(b.up-=dt)<=0){b.up=0;if(b.nb)b.nb=0;else{b.lv++;b.max=mhp(b);b.hp=b.max}}}}
const flash=h=>{const m=document.getElementById('msg');m.firstChild.innerHTML=h;m.classList.add('on')};

function ui(){
 const $=id=>document.getElementById(id);let h='';
 $('top').innerHTML=mode=='v'?`<span>🪙 ${S.g|0}/${cap.g()}</span><span class=e>💧 ${S.e|0}/${cap.e()}</span><span>🏆 ${S.tr}</span><span>🔨 ${builders()}/2</span><button data-menu=1 style="min-width:0;min-height:0;padding:2px 10px">⚙</button>${isAdm()?'<button data-adm=1 style="min-width:0;min-height:0;padding:2px 10px">👑</button>':''}`:`<span>⏱ ${Math.max(0,A.time|0)}s</span><span>💥 ${Math.round(pct()*100)}%</span><span>${'★'.repeat(stars())+'☆'.repeat(3-stars())}</span>`;
 if(mode=='v'){
  h=`<div class="row sc"><button data-tab=shop>🛒 Tienda</button><button class=atk data-a=1 ${used(S.army)||S.army.king?'':'disabled'}>⚔️ ¡Atacar!</button>${S.b.some(b=>b.ruin)?'<button data-fix=1>🔧 Reparar todo</button>':''}<button data-m=1 ${ONL&&(used(S.army)||S.army.king)?'':'disabled'}>🌐 Atacar jugador real</button><button data-l=1 ${ONL?'':'disabled'}>🏆 Ranking</button></div><div class=hint>${ONL?'En línea: otros jugadores pueden atacar tu aldea':'Modo solo (sin conexión multijugador)'}</div>`;
  if(tab=='shop')h+='<div class="row sc">'+Object.keys(TY).filter(t=>TY[t].cost&&t!='wall').map(t=>{const d=TY[t],c=cost(t);return`<button data-b=${t} class="${sel==t?'on':''}" ${S[d.cur]<c||cnt(t)>=mx(t)?'disabled':''}>${d.e||'🧱'} ${d.n}<small>${c} ${d.cur=='g'?'🪙':'💧'} · ${cnt(t)}/${mx(t)}</small></button>`}).join('')+'</div>'+(sel?(sel=='wall'?'<div class=row><button data-no=1>✖ Terminar muros</button></div><div class=hint>Arrastra el dedo por el mapa para dibujar muros.</div>':'<div class=row><button class=okb data-ok=1>✔ Construir</button><button data-no=1>✖ Cancelar</button></div><div class=hint>Arrastra el edificio o toca el mapa para moverlo.</div>'):'');
  if(tab=='army')h+=armyX();if(0)h+=`<div class="row sc">`+Object.keys(TR).map(k=>{const d=TR[k];return`<button data-t=${k} ${S.e<d.cost||used(S.army)+d.sp>campCap()||(d.hero&&S.army[k])?'disabled':''}>${d.e} ${d.n} ×${S.army[k]}<small>${d.cost} 💧 · ${d.hero?'Héroe':d.sp+' espacio'}</small></button>`}).join('')+`${Object.keys(SP).map(k=>`<button data-s=${k} ${S.e<SP[k].cost||spn()>=5?'disabled':''}>${SP[k].e} ${SP[k].n} ×${S.sp[k]}<small>${SP[k].cost} 💧 · hechizo</small></button>`).join('')}</div><div class=hint>Espacio: ${used(S.army)}/${campCap()} · Hechizos: ${spn()}/5</div>`;
  if(tab=='info'&&pk){const d=TY[pk.t];h+=`<div class=info>${d.n} · Nivel ${pk.lv}/${lcap(pk)} · ❤️ ${pk.hp|0}/${pk.max}`+(pk.up>0?`<br>🔨 Mejorando… ${Math.ceil(pk.up)}s`:(d.cost||pk.t=='hall')&&pk.lv<(lcap(pk))?`<br><button data-u=1 ${S[d.cur]<upc(pk)||!builders()||!reqOk(pk)?'disabled':''}>Mejorar a nivel ${pk.lv+1}<small>${upc(pk)} ${d.cur=='g'?'🪙':'💧'}</small></button>`:'')+`</div>`}
  if(tab=='scout'&&pk)h+=scoutX();if(tab=='info'&&pk)h+=infoX();if(!tab)h+=`<div class=hint>Los recursos se recolectan solos hasta llenar cada estructura (burbuja): tócala para reiniciar. Toca el cuartel para entrenar.</div>`;
  if(mv&&sel)h+='<div class=row><button class=okb data-ok=1>✔ Mover aquí</button><button data-no=1>✖ Cancelar</button></div>';h+=`<div class=hint>${ONL?'<button data-out=1 style="min-width:0;font-size:.7rem">Cerrar sesión ('+esc(S.name||'')+')</button>':''}</div>`;
 } else h=`<div class=row>`+Object.keys(TR).map(k=>`<button data-p=${k} class="${pick==k?'on':''}" >${TR[k].e} ×${A.army[k]}</button>`).join('')+`<button data-r=1>🏳️ Retirada</button>${Object.keys(SP).map(k=>`<button data-p=${k} class="${pick==k?'on':''}" ${A.sp[k]?'':'disabled'}>${SP[k].e} ×${A.sp[k]}</button>`).join('')}</div>${atkCtl()}<div class=hint>Toca el terreno a 2 casillas de los edificios para desplegar. Los muros bloquean el paso.</div>`;
 if(mode=='v'&&(tab=='info'||tab=='army'||tab=='scout')&&pk&&!sel)h=h.replace(/^<div class="row sc">.*?<\/div><div class=hint>[^<]*<\/div>/,'<div class=row><button data-x=1>✕ Cerrar</button></div>');if(h!==pc){$('panel').innerHTML=h;pc=h}
}
document.getElementById('panel').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab)tab=tab==d.tab?null:d.tab,sel=null;
 else if(d.b){sel=sel==d.b?null:d.b;mkGh()}else if(d.ok)buildGh();else if(d.no){cancelMv();sel=null;gh=null;hov=null}
 else if(d.t){const t=TR[d.t];if(S.e>=t.cost&&used(S.army)+t.sp<=campCap()&&!(t.hero&&S.army[d.t])){S.e-=t.cost;S.army[d.t]++}}
 else if(d.q){A.qty[pick]=Math.max(1,Math.min(A.army[pick]||1,(A.qty[pick]||1)+Number(d.q)))}else if(d.o){A.ord[pick]=d.o;for(const t of A.tr)if(t.k==pick&&t.hp>0){t.tc=d.o;t.tg=null}}else if(d.x){pk=null;tab=null}else if(d.ti)tab='info';else if(d.ta)tab='army';else if(d.tq){const[k,dd]=d.tq.split(':');TQ[k]=Math.max(1,Math.min(20,(TQ[k]||1)+Number(dd)))}else if(d.tr)enqueue(d.tr);else if(d.sc){if(S.e>=60&&(S.sc||0)<8){S.e-=60;S.sc=(S.sc||0)+1}}else if(d.ub&&pk)upBlock();else if(d.fix)fixAll();else if(d.del&&pk)demolish();else if(d.ua&&pk)upAllWalls();else if(d.rep&&pk){const c=rc(pk),k=TY[pk.t].cur;if(pk.ruin&&S[k]>=c){S[k]-=c;pk.ruin=0}}else if(d.mv&&pk){mv=pk;mv.hp0=mv.hp;mv.hp=0;sel=pk.t;gh={x:pk.x,y:pk.y};hov=[pk.x+TY[pk.t].s/2,pk.y+TY[pk.t].s/2];tab=null}else if(d.m)findReal();else if(d.l)ranking();else if(d.s){const s=SP[d.s];if(S.e>=s.cost&&spn()<5){S.e-=s.cost;S.sp[d.s]++}}else if(d.a)startAttack();
 else if(d.p)pick=d.p;
 else if(d.r)endAttack();
 else if(d.u){const t=TY[pk.t],c=upc(pk);if(pk.lv<(lcap(pk))&&S[t.cur]>=c&&builders()&&reqOk(pk)){S[t.cur]-=c;if(t.flat){pk.lv++;pk.max=mhp(pk);pk.hp=pk.max}else pk.up=pk.lv*12}}
 else if(d.out)logout()
 ui();save();
};
cv.onpointermove=e=>{const[x,y]=tl(e);hov=[x,y]};cv.onpointerleave=()=>hov=null;
cv.onpointerdown=e=>{
 if(document.getElementById('msg').classList.contains('on'))return;try{AC.resume()}catch(e){}
 const[x,y]=tl(e),tx=Math.floor(x),ty=Math.floor(y);
 if(mode=='v'){
  if(sel){const d=TY[sel],s=d.s,px=Math.max(0,Math.min(N-s,Math.round(x-s/2))),py=Math.max(0,Math.min(N-s,Math.round(y-s/2))),c=cost(sel);
   if(free(S.b,px,py,s)&&S[d.cur]>=c&&cnt(sel)<mx(sel)){S[d.cur]-=c;S.b.push(mk(sel,px,py));if(sel!='wall'||S[d.cur]<c)sel=null}}
  else{const b=at(S.b,tx,ty);pk=b||null;tab=b?'info':null;
   if(b&&TY[b.t].prod&&b.st>=240*M(b.lv)-1){b.st=0;snd(880,.12,'triangle',.05)}}
 } else if(A.on&&SP[pick]){if(A.sp[pick]>0){A.sp[pick]--;castSp(pick,x,y);if(!A.sp[pick])pick=Object.keys(TR).find(k=>A.army[k])||pick}} else if(A.on&&A.army[pick]>0&&x>-2&&y>-2&&x<N+2&&y<N+2&&!E.b.some(b=>b.hp>0&&b.t!='wall'&&edge({x,y},b)<2)){
  snd(300,.07,'square');A.army[pick]--;A.tr.push({k:pick,x,y,hp:TR[pick].hp,max:TR[pick].hp,cd:0,tg:null});
  if(!A.army[pick])pick=Object.keys(TR).find(k=>A.army[k])||pick;
 }
 ui();save();
};

function startAttack(){
 const L=S.lv,el=Math.min(5,1+(L>>1)),b=[mk('hall',7,7,el)],lv=(t,x,y)=>b.push(mk(t,x,y,el));
 for(let i=4;i<=13;i++)for(const[x,y]of[[i,4],[i,13],[4,i],[13,i]])if(!b.some(w=>w.t=='wall'&&w.x==x&&w.y==y))lv('wall',x,y);
 const put=(t,lo,hi,out)=>{for(let k=0;k<90;k++){const x=lo+Math.random()*(hi-lo)|0,y=lo+Math.random()*(hi-lo)|0;if((!out||x<3||x>14||y<3||y>14)&&free(b,x,y,2)){lv(t,x,y);return}}};
 const df=['cannon','tower','mortar'];
 for(let i=0;i<2+Math.min(L,4);i++)put(i<2?df[i%2]:df[Math.random()*3|0],5,11);
 for(const t of['mine','pump','gst','camp'])put(t,5,11);
 for(const t of['mine','pump','est','mine'])put(t,0,16,1);

 admEl.innerHTML=`<div class=row><b>👑 Panel de administrador</b><button data-aa=close>✕ Cerrar</button><button data-aa=reload>🔄</button></div><div class=al>`+AP.map(x=>`<button data-ap=${x.id} class="${x.id==AS?'on':''}">${esc(x.name)} · ${x.tr}🏆 · ${x.g}🪙 ${x.e}💧${x.banned?' ⛔':''}${x.warns?' ⚠'+x.warns:''}</button>`).join('')+`</div>`+(p?`<div class=ad><b>${esc(p.name)}</b><input id=aw type=number placeholder="wins"><div class=row><button data-aa=wp>+ wins</button><button data-aa=wm>− wins</button></div><input id=ag type=number placeholder="oro"><input id=ae type=number placeholder="elixir"><div class=row><button data-aa=rp>+ recursos</button><button data-aa=rm>− recursos</button></div><div class=row><button data-aa=${p.banned?'unban':'ban'}>${p.banned?'Desbanear':'Banear'}</button><button data-aa=reset>Reiniciar jugador</button></div><input id=am2 maxlength=150 placeholder="Mensaje de advertencia"><button data-aa=warn>⚠ Dar advertencia</button></div>`:'<div class=hint>Selecciona un jugador</div>')+`<div class=ad><button data-aa=resetall>Reiniciar a TODOS</button></div><div class=hint>${esc(m||'')}</div>`}
admEl.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,v=id=>parseInt(document.getElementById(id).value)||0;
 if(d.ap){AS=d.ap;admDraw();return}const a=d.aa;if(!a)return;
 if(a=='close'){admEl.style.display='none';return}if(a=='reload'){admLoad();return}
 let r;
 if(a=='resetall'){if(!confirm('¿Reiniciar a TODOS los jugadores?'))return;r=await sb.rpc('admin_reset_all')}
 else{if(!AS)return;if(a=='reset'&&!confirm('¿Reiniciar a este jugador?'))return;
  const m={wp:['wins',v('aw')],wm:['wins',-v('aw')],rp:['res',v('ag'),v('ae')],rm:['res',-v('ag'),-v('ae')],ban:['ban'],unban:['unban'],reset:['reset'],warn:['warn',0,0,document.getElementById('am2').value]}[a];
  r=await sb.rpc('admin_act',{p_id:AS,p_act:m[0],p_a:m[1]||0,p_b:m[2]||0,p_msg:m[3]||null})}
 if(r.error){admDraw(r.error.message);return}await admLoad()};
document.getElementById('top').onclick=e=>{if(e.target.closest('[data-menu]')){menuEl.style.display='flex';menuDraw()}if(e.target.closest('[data-adm]')){admEl.style.display='flex';admLoad()}};

const BT={mine:20,pump:20,gst:30,est:30,camp:25,rax:40,scout:30,cannon:35,tower:45,mortar:60};
const TS={barb:5,arch:8,giant:25,gob:4,wb:12,king:60};let TQ={};
const rxLv=()=>Math.max(1,...S.b.filter(b=>b.t=='rax'&&!b.ruin&&!b.nb).map(b=>b.lv));
const rxF=()=>Math.max(.35,1-.15*(rxLv()-1));
const tt=k=>Math.max(1,Math.round(TS[k]*rxF()*10)/10);
const qsp=()=>(S.q||[]).reduce((a,j)=>a+j.n*TR[j.k].sp,0);
function trainTick(dt){const q=S.q;if(!q||!q.length)return;const j=q[0];j.t=(j.t==null?tt(j.k):j.t)-dt;if(j.t<=0){S.army[j.k]=(S.army[j.k]||0)+1;j.n--;j.t=null;snd(660);if(j.n<=0)q.shift()}}
function enqueue(k){const d=TR[k],n=d.hero?1:(TQ[k]||1),c=n*d.cost;S.q=S.q||[];if(S.e<c||d.sp*n>campCap()-used(S.army)-qsp()||(d.hero&&(S.army[k]||S.q.some(j=>j.k==k))))return;S.e-=c;const l=S.q[S.q.length-1];if(l&&l.k==k&&l.t==null)l.n+=n;else S.q.push({k,n,t:null});snd(500)}
function armyX(){const lv=rxLv(),fr=campCap()-used(S.army)-qsp(),q=S.q||[];
 let h=`<div class=hint>Cuartel nv ${lv}: −${Math.round((1-rxF())*100)}% tiempo de entrenamiento · Espacio libre ${fr}/${campCap()}</div><div class=row><button data-ti=1>⬆ Mejorar cuartel</button></div>`;
 for(const k of Object.keys(TR)){const d=TR[k],n=d.hero?1:Math.min(TQ[k]||1,20),c=n*d.cost,ok=S.e>=c&&d.sp*n<=fr&&!(d.hero&&(S.army[k]||q.some(j=>j.k==k)));
  h+=`<div class=row><button disabled>${d.e} ${d.n} ×${S.army[k]||0}<small>${tt(k)}s c/u · ${d.cost} 💧</small></button>`+(d.hero?'':`<button data-tq=${k}:-1>−</button><button disabled>${n}</button><button data-tq=${k}:1>+</button>`)+`<button class=okb data-tr=${k} ${ok?'':'disabled'}>Entrenar<small>${c} 💧 · ${Math.round(tt(k)*n)}s</small></button></div>`}
 h+='<div class=row>'+Object.keys(SP).map(k=>`<button data-s=${k} ${S.e<SP[k].cost||spn()>=5?'disabled':''}>${SP[k].e} ${SP[k].n} ×${S.sp[k]}<small>${SP[k].cost} 💧</small></button>`).join('')+'</div>';
 if(q.length)h+=`<div class=hint>En cola: ${q.map(j=>TR[j.k].e+'×'+j.n).join(' ')} · siguiente en ${Math.ceil(q[0].t==null?tt(q[0].k):q[0].t)}s</div>`;
 return h}
const menuEl=document.getElementById('menu');let FORCE=false;try{FORCE=localStorage.getItem('ccl')=='1'}catch(e){}
const mqL=matchMedia('(orientation:landscape)');
function applyLand(){document.body.classList.toggle('land',FORCE||mqL.matches)}
mqL.addEventListener('change',applyLand);applyLand();
function menuDraw(){menuEl.innerHTML=`<div class=mbox><div class=row><b>Menú</b><button data-m2=close>✕</button></div><button data-m2=fs>⛶ Pantalla completa</button><button data-m2=snd>${MUTE?'🔇 Sonido: OFF':'🔊 Sonido: ON'}</button><button data-m2=land>${FORCE?'📱 Modo vertical':'🖥 Modo horizontal'}</button></div>`}
menuEl.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.m2;
 if(a=='close'){menuEl.style.display='none';return}
 if(a=='snd'){MUTE=!MUTE;try{localStorage.setItem('ccm',MUTE?'1':'0')}catch(_){}if(!MUTE)snd(880)}
 if(a=='fs'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(_){}}
 if(a=='land'){FORCE=!FORCE;try{localStorage.setItem('ccl',FORCE?'1':'0')}catch(_){}applyLand();try{if(FORCE){await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}else screen.orientation.unlock()}catch(_){}}
 menuDraw()};

function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;trainTick(dt);if(mv&&!sel)cancelMv();if(mode=='v'&&t-lu>250){lu=t;ui()}{const n=mode=='a'&&E?E.N:vN();if(n!=N){N=n;fit();clampCam()}}
 if(mode=='v')vil(dt);else if(A.on){sim(dt);if(A)ui()}
 draw();requestAnimationFrame(loop)}
ui();setInterval(()=>{if(mode=='v'){ui();save()}},1000);requestAnimationFrame(loop);
</script></body></html>
